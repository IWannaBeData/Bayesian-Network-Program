<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bayesian Network Studio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <h1>Bayesian Network Studio</h1>
        <p>Create Evidence and Hypothesis nodes, connect arrows, set probabilities, and infer outcomes.</p>
      </header>

      <div class="layout">
        <aside class="panel left-panel">
          <h2>Build</h2>
          <div class="button-stack">
            <button data-add-node="evidence">+ Evidence Node</button>
            <button data-add-node="hypothesis">+ Hypothesis Node</button>
            <button id="connectModeBtn">🔗 Connect Nodes</button>
            <button id="deleteSelectedBtn">🗑 Delete Selected</button>
          </div>

          <h2>Persistence</h2>
          <div class="button-stack">
            <button id="saveFileBtn">⬇ Save to File</button>
            <label class="upload-btn">
              ⬆ Upload Save File
              <input id="uploadInput" type="file" accept=".json,application/json" />
            </label>
            <button id="quickSaveBtn">💾 Quick Save (local)</button>
            <button id="quickLoadBtn">📂 Quick Load (local)</button>
          </div>
        </aside>

        <main class="canvas-wrap">
          <div id="canvas" class="canvas">
            <svg id="edgeLayer"></svg>
          </div>
        </main>

        <aside class="panel right-panel">
          <h2>Inspector</h2>
          <div id="emptySelection" class="hint">Select a node to edit its name, states, evidence, and CPT.</div>
          <div id="inspector" class="inspector hidden">
            <label>Name <input id="nodeName" type="text" /></label>
            <label>Type <input id="nodeType" type="text" disabled /></label>
            <label>Evidence
              <select id="evidenceSelect"></select>
            </label>
            <label>States (comma separated)
              <input id="stateInput" type="text" />
            </label>
            <button id="applyStatesBtn">Apply States</button>
            <h3>CPT</h3>
            <div id="cptContainer" class="cpt-container"></div>
          </div>

          <h2>Inference</h2>
          <button id="runInferenceBtn">Run Exact Inference</button>
          <div id="inferenceOutput" class="inference-output"></div>

          <h2>Plain Language Summary</h2>
          <div id="summaryOutput" class="inference-output"></div>
        </aside>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
